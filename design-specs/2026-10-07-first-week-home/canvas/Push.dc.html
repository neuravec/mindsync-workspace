<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First week reminders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #1E4043; font-family: Figtree, sans-serif; color: #113237; padding: 36px 14px 24px 14px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #AAE5E2; padding: 6px 6px 0 6px">{{n.day}}</span>
<div style="border-radius: 20px; background: #FFFFFF; padding: 12px 14px; display: flex; gap: 12px">
<span aria-hidden="true" style="flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px; background: #113237; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#AAE5E2"><path d="M5 19c2.5-1 4.4-4.2 5.3-9.4C10.8 6.6 12.3 4.4 15 4c-.9 1.9-1.1 4.2-.6 6.9.6 3.3 2.2 6.3 4.6 8.1H5z"/></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 13px; font-weight: 700; color: #5A7A73">MindSync</span><span style="font-size: 13px; color: #5A7A73">{{n.time}}</span></span>
<span style="font-size: 16px; font-weight: 800">{{n.title}}</span>
<span style="font-size: 15px; line-height: 1.4; color: #1F4C50">{{n.body}}</span>
</span>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"branch":{"editor":"enum","options":["schedule","none"],"default":"schedule"},"details":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const therapy = (this.props.branch ?? 'schedule') === 'schedule';
    const details = !!(this.props.details ?? false);
    const neutral = {
      talk: { title: 'Your step for today is ready', body: 'About 3 minutes, whenever suits you.' },
      prep: { title: 'A 2-minute step for tomorrow', body: 'Open MindSync when you have a moment.' },
      after: { title: 'A 2-minute step is ready', body: 'Best done while it is fresh.' },
      note: { title: 'A 1-minute step is ready', body: 'Open MindSync when you have a moment.' },
      checkin: { title: '30 seconds for you', body: 'A quick check-in is ready.' },
      week: { title: 'Your first week is ready to look back on', body: 'Two minutes, whenever suits you.' }
    };
    const rich = {
      talk: { title: 'Orca has a follow-up', body: 'About something from your first talk. Three minutes.' },
      prep: { title: 'Your session is tomorrow', body: 'Want to note what you would like to bring?' },
      after: { title: 'How did your session go?', body: 'Capture it while it is fresh. Two minutes.' },
      note: { title: 'One minute for a voice note', body: 'Say how your week is going. Orca sums it up.' },
      checkin: { title: 'Quick check-in', body: 'See today next to where you started.' },
      week: { title: 'Your first week with Orca', body: 'What you did and a rhythm that fits you.' }
    };
    const t = details ? rich : neutral;
    const items = therapy ? [
      { day: 'Tuesday', time: '7:00 pm', ...t.talk },
      { day: 'Wednesday', time: '7:00 pm', ...t.prep },
      { day: 'Thursday, 75 min after the session', time: '6:15 pm', ...t.after },
      { day: 'Saturday', time: '7:00 pm', ...t.checkin },
      { day: 'Next Monday', time: '7:00 pm', ...t.week }
    ] : [
      { day: 'Tuesday', time: '7:00 pm', ...t.talk },
      { day: 'Thursday', time: '7:00 pm', ...t.note },
      { day: 'Friday', time: '7:00 pm', ...t.checkin },
      { day: 'Next Monday', time: '7:00 pm', ...t.week }
    ];
    return { items: items };
  }
}
</script>
</body>
</html>
