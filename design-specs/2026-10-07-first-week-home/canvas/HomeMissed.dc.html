<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, yesterday's step moved to today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1280px; font-family: Figtree, sans-serif; color: #113237">
<dc-import name="Main" branch="{{ p.branch }}" day="{{ p.day }}" done-steps="{{ p.done }}" calm="{{ p.calm }}" push-state="{{ p.push }}" premium="{{ p.premium }}" quota-out="{{ p.quota }}" expanded="{{ p.open }}" hint-size="390px,1280px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    return { p: { branch: 'none', day: 2, done: '', calm: false, push: 'granted', premium: false, quota: false, open: true } };
  }
}
</script>
</body>
</html>
