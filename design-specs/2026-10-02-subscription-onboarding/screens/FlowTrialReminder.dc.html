<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trial ends tomorrow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, sans-serif; color: #113237">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
    <dc-import name="CurHome" show-trial="{{ true }}" days-left="{{ 1 }}" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14,29,31,0.55)"></div>
  <div role="dialog" aria-label="Your trial ends tomorrow" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; background: #F6FFFD; border-radius: 24px 24px 0 0; padding: 12px 20px 30px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #BBE4DE"></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #8A4B12">Day 3 of 4</span>
      <h2 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800">Your Premium trial ends tomorrow</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3D5C60">Here is what you did with it so far. Everything stays saved either way.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="border-radius: 14px; background: #FFFFFF; border: 1px solid #DBF0ED; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 22px; font-weight: 800">{{s.n}}</span>
          <span style="font-size: 12px; line-height: 1.3; color: #3D5C60">{{s.l}}</span>
        </div>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #1E4043">From tomorrow on Free: 1 Before therapy and 1 After therapy, 3 Between Sessions and 15 Reflect messages a month, 2 recordings in total.</p>
    <button type="button" style="height: 56px; border: none; border-radius: 16px; background: #113237; color: #FFFFFF; font-family: Figtree, sans-serif; font-size: 17px; font-weight: 700">Keep Premium</button>
    <button type="button" style="height: 44px; border: none; background: transparent; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 600; color: #113237">Not now</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { stats: [{ n: '[n]', l: 'Before and After therapy' }, { n: '[n]', l: 'Recordings' }, { n: '[n]', l: 'Reflect messages' }] };
  }
}
</script>
</body>
</html>
