<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your subscription</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#113237}a:hover{color:#0E1D1F}
.ms-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="ms-scroll" style="width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; scrollbar-width: none; background: #F6FFFD; font-family: Figtree, sans-serif; color: #113237">
  <div style="display: flex; align-items: center; gap: 4px; padding: 12px 16px 4px 12px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#113237" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800">Your subscription</h1>
  </div>

  <div style="padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #113237; color: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #BBE4DE">MindSync Premium</span>
        <span style="font-size: 12px; font-weight: 800; background: #FFC88A; color: #113237; border-radius: 999px; padding: 4px 10px">{{badge}}</span>
      </div>
      <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.4px">{{planName}}</div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #DBF0ED">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BBE4DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>{{dateLine}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #DBF0ED">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BBE4DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
          <span>{{billLine}}</span>
        </div>
      </div>
    </div>

    <button type="button" style="height: 52px; border: 1.5px solid #113237; border-radius: 16px; background: #FFFFFF; font-family: Figtree, sans-serif; font-size: 16px; font-weight: 700; color: #113237; cursor: pointer">{{actionLabel}}</button>
    <p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 1.45; color: #3D5C60">{{actionHint}}</p>
  </div>

  <div style="padding: 28px 20px 0 20px; display: flex; flex-direction: column; gap: 4px">
    <h2 style="margin: 0 0 8px 0; font-size: 18px; font-weight: 800">Included in your plan</h2>
    <sc-for list="{{feats}}" as="f" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 40px; border-bottom: 1px solid #E3F2EF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#26767B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span style="font-size: 15px; font-weight: 500">{{f}}</span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 24px 20px 32px 20px; display: flex; flex-direction: column; gap: 4px">
    <button type="button" style="min-height: 44px; border: none; background: transparent; padding: 0; text-align: left; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 600; color: #113237; cursor: pointer">Restore purchases</button>
    <div style="display: flex; gap: 20px">
      <a href="https://www.mindsync.app/terms-conditions" style="font-size: 13px; min-height: 44px; display: flex; align-items: center">Terms of Service</a>
      <a href="https://www.mindsync.app/privacy-policy" style="font-size: 13px; min-height: 44px; display: flex; align-items: center">Privacy Policy</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"source":{"editor":"enum","options":["store","trial","promo"],"default":"store"},"plan":{"editor":"enum","options":["annual","monthly"],"default":"annual"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const source = this.props.source ?? 'store';
    const plan = this.props.plan ?? 'annual';
    const v = {
      store: {
        badge: 'Active',
        planName: plan === 'annual' ? 'Annual plan' : 'Monthly plan',
        dateLine: 'Renews on [renewal date]',
        billLine: 'Billed through the App Store',
        actionLabel: 'Manage subscription',
        actionHint: 'Opens your store account, where you can switch plans or cancel. You keep Premium until the end of the paid period.'
      },
      trial: {
        badge: 'Free trial',
        planName: 'Premium trial',
        dateLine: 'Trial ends on [trial end date]',
        billLine: 'Nothing is charged automatically',
        actionLabel: 'Choose a plan',
        actionHint: 'Pick a plan before the trial ends to keep Before therapy, After therapy and recordings unlimited.'
      },
      promo: {
        badge: 'Promo code',
        planName: 'Premium via promo',
        dateLine: 'Access until [promo end date]',
        billLine: 'No payment on file',
        actionLabel: 'See plans',
        actionHint: 'Your promo access ends on the date above. You can pick a plan any time.'
      }
    }[source];
    return {
      ...v,
      feats: ['Unlimited Before therapy & After therapy', 'Unlimited session recordings', 'Unlimited Reflect messages', 'Reflect voice mode', 'Unlimited habits', 'Full monthly therapy summary']
    };
  }
}
</script>
</body>
</html>
