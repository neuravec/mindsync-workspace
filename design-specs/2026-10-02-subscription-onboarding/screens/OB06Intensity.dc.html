<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How strong it feels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
input[type=range]{accent-color:#113237}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6FFFD; font-family: Figtree, sans-serif; color: #113237; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 48px 20px 0 8px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#113237" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #DBF0ED; display: flex"><div style="width: 28%; border-radius: 3px; background: #26767B"></div></div>
    <span style="font-size: 13px; font-weight: 600; color: #3D5C60">2 of 7</span>
  </div>
  <div style="flex-grow: 1; padding: 20px 24px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800">How strong is each one right now?</h1>
    <p style="margin: 0; font-size: 15px; color: #3D5C60">1 is barely there, 10 is overwhelming. This is your starting point.</p>
    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 4px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="background: #FFFFFF; border: 1px solid #DBF0ED; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <label for="{{r.id}}" style="font-size: 17px; font-weight: 700">{{r.name}}</label>
            <span style="font-size: 22px; font-weight: 800">{{r.v}}</span>
          </div>
          <input id="{{r.id}}" type="range" min="1" max="10" step="1" value="{{r.v}}" onInput="{{r.set}}" style="width: 100%; height: 32px; margin: 0">
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5A7376"><span>Barely there</span><span>Overwhelming</span></div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="padding: 12px 24px 28px 24px">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 16px; background: #113237; color: #FFFFFF; font-family: Figtree, sans-serif; font-size: 17px; font-weight: 700">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { Unease: 7, Sleep: 6, Stress: 4 }; }
  renderVals() {
    return {
      rows: ['Unease', 'Sleep', 'Stress'].map((n) => ({
        id: 'int-' + n.toLowerCase(),
        name: n,
        v: this.state[n],
        set: (e) => this.setState({ [n]: Number(e.target.value) })
      }))
    };
  }
}
</script>
</body>
</html>
