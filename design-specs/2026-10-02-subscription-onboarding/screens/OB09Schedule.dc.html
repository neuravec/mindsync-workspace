<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>When are your sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6FFFD; font-family: Figtree, sans-serif; color: #113237; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 48px 20px 0 8px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#113237" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #DBF0ED; display: flex"><div style="width: 71%; border-radius: 3px; background: #26767B"></div></div>
    <span style="font-size: 13px; font-weight: 600; color: #3D5C60">5 of 7</span>
  </div>
  <div style="flex-grow: 1; padding: 20px 24px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800">When is your next session?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3D5C60">The day before, you get a Before therapy card with what to bring up, and a reminder.</p>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding-top: 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" aria-label="{{d.full}}" style="{{d.style}}">{{d.l}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ob-time" style="font-size: 13px; font-weight: 600; color: #3D5C60">Time</label>
      <input id="ob-time" type="time" value="18:00" style="height: 52px; box-sizing: border-box; border: 1px solid #BBE4DE; border-radius: 12px; padding: 0 14px; font-family: Figtree, sans-serif; font-size: 17px; background: #FFFFFF; color: #113237">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #3D5C60">How often</span>
      <div role="radiogroup" aria-label="How often" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid #BBE4DE; border-radius: 12px; overflow: hidden; background: #FFFFFF">
        <sc-for list="{{freq}}" as="f" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.l}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; gap: 10px; align-items: center; background: #FFEFDD; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A4B12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Next session: <b>{{next}}</b>. Your first Before therapy card arrives the day before.</span>
    </div>
  </div>
  <div style="padding: 12px 24px 28px 24px; display: flex; flex-direction: column; gap: 4px">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 16px; background: #113237; color: #FFFFFF; font-family: Figtree, sans-serif; font-size: 17px; font-weight: 700">Continue</button>
    <button type="button" style="height: 44px; border: none; background: transparent; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 600; color: #3D5C60">I don't have a date yet</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { day: 3, freq: 'Weekly' }; }
  renderVals() {
    const L = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const F = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    return {
      days: L.map((l, i) => {
        const on = this.state.day === i;
        return { l: l, full: F[i], pressed: on ? 'true' : 'false', pick: () => this.setState({ day: i }),
          style: 'height: 48px; border-radius: 12px; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; padding: 0; ' + (on ? 'background: #113237; color: #FFFFFF; border: 1.5px solid #113237' : 'background: #FFFFFF; color: #113237; border: 1.5px solid #BBE4DE') };
      }),
      freq: ['Weekly', 'Every 2 weeks', 'Custom'].map((l) => {
        const on = this.state.freq === l;
        return { l: l, pressed: on ? 'true' : 'false', pick: () => this.setState({ freq: l }),
          style: 'height: 46px; border: none; font-family: Figtree, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #113237; color: #FFFFFF' : 'background: transparent; color: #113237') };
      }),
      next: F[this.state.day] + ', 6:00 PM'
    };
  }
}
</script>
</body>
</html>
