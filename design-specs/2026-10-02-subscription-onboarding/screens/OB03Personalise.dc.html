<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>About you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6FFFD; font-family: Figtree, sans-serif; color: #113237; display: flex; flex-direction: column">
  <div class="ms-scroll" style="flex-grow: 1; overflow-y: auto; scrollbar-width: none; padding: 52px 24px 16px 24px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800">What should we call you?</h1>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ob-name" style="font-size: 13px; font-weight: 600; color: #3D5C60">Your name or nickname</label>
      <input id="ob-name" type="text" autocomplete="nickname" value="[Name]" style="height: 52px; box-sizing: border-box; border: 2px solid #113237; border-radius: 12px; padding: 0 14px; font-family: Figtree, sans-serif; font-size: 17px; background: #FFFFFF">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Your age range <span style="font-weight: 500; color: #5A7376">(optional)</span></span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ages}}" as="a" hint-placeholder-count="6">
          <button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="{{a.style}}">{{a.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ob-gender" style="font-size: 13px; font-weight: 600; color: #3D5C60">Gender (optional)</label>
        <select id="ob-gender" style="height: 50px; border: 1px solid #BBE4DE; border-radius: 12px; padding: 0 10px; font-family: Figtree, sans-serif; font-size: 15px; background: #FFFFFF; color: #113237"><option>Prefer not to say</option><option>Woman</option><option>Man</option><option>Non-binary</option><option>Self-describe</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ob-pron" style="font-size: 13px; font-weight: 600; color: #3D5C60">Pronouns (optional)</label>
        <select id="ob-pron" style="height: 50px; border: 1px solid #BBE4DE; border-radius: 12px; padding: 0 10px; font-family: Figtree, sans-serif; font-size: 15px; background: #FFFFFF; color: #113237"><option>They/Them</option><option>She/Her</option><option>He/Him</option><option>Other</option></select>
      </div>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #3D5C60">[Orca] uses your name and pronouns when it talks to you. You can change them later in Settings.</p>
  </div>
  <div style="padding: 12px 24px 28px 24px">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 16px; background: #113237; color: #FFFFFF; font-family: Figtree, sans-serif; font-size: 17px; font-weight: 700">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { age: '25-34' }; }
  renderVals() {
    const labels = ['18-24', '25-34', '35-44', '45-54', '55+', 'Prefer not to say'];
    return {
      ages: labels.map((l) => {
        const on = this.state.age === l;
        return {
          label: l,
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ age: l }),
          style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #113237; color: #FFFFFF; border: 1px solid #113237' : 'background: #FFFFFF; color: #113237; border: 1px solid #BBE4DE')
        };
      })
    };
  }
}
</script>
</body>
</html>
