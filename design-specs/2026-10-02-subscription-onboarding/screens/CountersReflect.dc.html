<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflect counter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6FFFD; font-family: Figtree, sans-serif; color: #113237; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 16px 12px 20px; border-bottom: 1px solid #DBF0ED">
    <span style="font-size: 20px; font-weight: 800">Reflect</span>
    <span style="{{chipStyle}}">{{chip}}</span>
  </div>
  <div style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: flex-start; max-width: 280px; background: #FFFFFF; border: 1px solid #DBF0ED; border-radius: 18px 18px 18px 6px; padding: 12px 14px; font-size: 15px; line-height: 1.45">[Orca's question about the last session]</div>
    <div style="align-self: flex-end; max-width: 260px; background: #113237; color: #FFFFFF; border-radius: 18px 18px 6px 18px; padding: 12px 14px; font-size: 15px; line-height: 1.45">[User's answer]</div>
    <div style="align-self: flex-start; max-width: 280px; background: #FFFFFF; border: 1px solid #DBF0ED; border-radius: 18px 18px 18px 6px; padding: 12px 14px; font-size: 15px; line-height: 1.45">[Orca's reply]</div>
  </div>

  <sc-if value="{{hasLeft}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 10px 16px 30px 16px; border-top: 1px solid #DBF0ED; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 8px; align-items: center">
        <label for="reflect-msg" class="sr" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message</label>
        <input id="reflect-msg" type="text" placeholder="Write to [Orca]..." style="flex-grow: 1; height: 48px; box-sizing: border-box; border: 1px solid #BBE4DE; border-radius: 24px; padding: 0 16px; font-family: Figtree, sans-serif; font-size: 16px">
        <button type="button" aria-label="Send" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: #113237; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <span style="font-size: 12px; color: #3D5C60; text-align: center">{{left}} of 15 free messages left this month</span>
    </div>
  </sc-if>
  <sc-if value="{{noneLeft}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 16px 16px 30px 16px; border-top: 1px solid #DBF0ED; background: #FFFEFB; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 15px; font-weight: 700">You have used your 15 free messages this month.</span>
      <span style="font-size: 13px; color: #3D5C60">Your conversation stays saved. Free messages come back on [Nov 1].</span>
      <button type="button" style="height: 52px; border: none; border-radius: 16px; background: #113237; color: #FFFFFF; font-family: Figtree, sans-serif; font-size: 16px; font-weight: 700">Keep talking with Premium</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"left":{"editor":"int","default":3,"min":0,"max":15},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const left = this.props.left ?? 3;
    const base = 'font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; ';
    return {
      left: left,
      hasLeft: left > 0,
      noneLeft: left === 0,
      chip: left === 0 ? '0 left · Premium' : left + ' of 15 left',
      chipStyle: base + (left === 0 ? 'background: #E8EEEE; color: #4F6669' : (left <= 3 ? 'background: #FFEFDD; color: #8A4B12' : 'background: #DBF0ED; color: #1F4C50'))
    };
  }
}
</script>
</body>
</html>
