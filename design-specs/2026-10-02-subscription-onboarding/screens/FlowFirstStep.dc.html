<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your first step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #113237; font-family: Figtree, sans-serif; color: #FFFFFF; padding: 64px 20px 30px 20px; display: flex; flex-direction: column; gap: 20px">
  <div style="align-self: center; display: flex; align-items: center; gap: 8px; background: rgba(255,200,138,0.14); border: 1px solid rgba(255,200,138,0.5); border-radius: 999px; padding: 6px 12px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFC88A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg>
    <span style="font-size: 13px; font-weight: 700; color: #FFC88A">Premium trial · 4 days left</span>
  </div>
  <h1 style="margin: 0; text-align: center; font-size: 26px; line-height: 1.2; font-weight: 800">I'd like to start with:</h1>

  <sc-if value="{{inTherapy}}" hint-placeholder-val="{{ true }}">
    <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 18px 16px; border-radius: 18px; background: #FFC88A; color: #113237; text-decoration: none">
      <span style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: rgba(17,50,55,0.10); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#113237" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 800">Capture a past session</span>
        <span style="font-size: 14px">After therapy, while it is fresh</span>
      </span>
    </a>
    <div style="text-align: center; font-size: 13px; color: #78D0D0; font-weight: 600">or</div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 16px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(187,228,222,0.25); color: #FFFFFF; text-decoration: none">
        <span style="flex-grow: 1; font-size: 16px; font-weight: 600; line-height: 1.3; padding: 12px 0">{{o}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#78D0D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 4px 4px 0 4px">
    <span style="flex-shrink: 0; width: 6px; height: 6px; border-radius: 3px; background: #FFC88A; margin-top: 7px"></span>
    <span style="font-size: 14px; line-height: 1.45; color: #DBF0ED">Leaving a short voice note will let us analyze what's going on and give you helpful tips on your therapy progress.</span>
  </div>
  <div style="flex-grow: 1"></div>
  <button type="button" style="height: 48px; border: none; background: transparent; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 600; color: #DBF0ED; text-decoration: underline; text-underline-offset: 3px">Take me to the app</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"inTherapy":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      inTherapy: this.props.inTherapy ?? true,
      opts: ['Talk with [Orca] about your therapy & wellbeing', 'Get a summary of how you feel with Between Sessions', 'Check the health of your Therapy Relationship']
    };
  }
}
</script>
</body>
</html>
