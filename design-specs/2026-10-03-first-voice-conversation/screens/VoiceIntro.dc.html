<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before the first conversation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#113237}a:hover{color:#0E1D1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6FFFD; font-family: Figtree, sans-serif; color: #113237; overflow: hidden">
  <div style="padding: 12px 16px 0 16px; display: flex">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#113237" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
  </div>

  <div style="flex-grow: 1; padding: 0 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center">
      <span style="position: absolute; width: 100px; height: 100px; border-radius: 50px; border: 1.5px solid #BBE4DE"></span>
      <span style="position: absolute; width: 86px; height: 86px; border-radius: 43px; border: 1.5px solid #78D0D0"></span>
      <span style="width: 72px; height: 72px; border-radius: 36px; background: #113237; display: flex; align-items: center; justify-content: center"><img src="/_blob/f69af35610efe64c4d77bb0bd7c51176" alt="" style="width: 38px; height: 39px"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; text-align: center">
      <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.4px">[Orca] would like to hear from you.</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #3D5C60">{{lead}}</p>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DBF0ED; border-radius: 18px; padding: 4px 16px">
      <sc-for list="{{topics}}" as="t" hint-placeholder-count="3">
        <div style="{{t.row}}">
          <span style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; background: #DBF0ED; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{t.n}}</span>
          <span style="font-size: 16px; font-weight: 600; line-height: 1.35">{{t.text}}</span>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid #E3F2EF">
        <span style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; background: #113237; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 16px; font-weight: 600; line-height: 1.35">Then, talk about anything</span>
          <span style="font-size: 13px; line-height: 1.4; color: #3D5C60">As long as you like. You end it, not [Orca].</span>
        </span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 0 4px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#26767B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span style="font-size: 14px; line-height: 1.45; color: #3D5C60">Private to you. You decide what, if anything, you share with others.</span>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px 20px; display: flex; flex-direction: column; gap: 6px">
    <a href="VoiceLive.dc.html" style="height: 56px; border-radius: 16px; background: #113237; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      Start talking
    </a>
    <p style="margin: 0; text-align: center; font-size: 13px; color: #3D5C60">Your phone will ask for microphone access.</p>
    <sc-if value="{{showType}}" hint-placeholder-val="{{ true }}">
      <a href="TypeFallback.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-underline-offset: 3px">Can't talk right now? Type instead</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"answers":{"editor":"enum","options":["filled","skipped"],"default":"filled"},"inTherapy":{"editor":"boolean","default":true},"showTypeOption":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const filled = (this.props.answers ?? 'filled') !== 'skipped';
    const inTherapy = filled && (this.props.inTherapy ?? true);
    const texts = filled ? [
      'How [anxiety] has shown up this week',
      'What has helped, even a little',
      inTherapy ? 'What you want from [Thursday]’s session' : 'What would make this week a good one'
    ] : [
      'What brought you here today',
      'What has been on your mind lately',
      'What you would like to feel more of'
    ];
    return {
      lead: filled
        ? '[Orca] has read your answers. It starts with three short questions, then the conversation is yours.'
        : '[Orca] starts with three short questions to get to know you, then the conversation is yours.',
      showType: this.props.showTypeOption ?? true,
      topics: texts.map((text, i) => ({
        n: String(i + 1),
        text: text,
        row: 'display: flex; align-items: center; gap: 14px; padding: 13px 0; ' + (i ? 'border-top: 1px solid #E3F2EF' : '')
      }))
    };
  }
}
</script>
</body>
</html>
