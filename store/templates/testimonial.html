<!doctype html>
<html lang="en" class="fmt-{{fmt}}">
<head>
<meta charset="utf-8">
<!-- Store screenshot, type "testimonial": quote mark, review text (forced lines from slides.json),
     italic attribution, rating stars, flat lighthouse/sailboat scene at the bottom (SVG recreated
     from the current ios-8 slide in brand colours). The review text is never edited here. -->
<link rel="stylesheet" href="store.css">
</head>
<body class="testimonial-slide">
  <div class="tcol" id="tcol">
    <svg class="qmark" viewBox="0 0 51 28" aria-hidden="true">
      <circle cx="12" cy="11" r="11"/>
      <path d="M23 11 C23 19 18 25.5 7 28 L6.4 26 C11.5 23.6 13.6 20.6 13.8 18.5 Z"/>
      <circle cx="39" cy="11" r="11"/>
      <path d="M50 11 C50 19 45 25.5 34 28 L33.4 26 C38.5 23.6 40.6 20.6 40.8 18.5 Z"/>
    </svg>
    <div class="quote" id="quote">{{quote}}</div>
    <div class="stars" id="stars">{{stars}}</div>
  </div>
  <svg class="illus" id="illus" data-safe="0.16" viewBox="0 0 600 369" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <rect x="0" y="270" width="600" height="99" fill="#78d0d0"/>
    <g fill="none" stroke="#2f6266" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 126 Q266 114 284 123 Q302 114 320 125"/>
      <path d="M328 72 Q337 64 347 70 Q356 64 366 72"/>
    </g>
    <g fill="#78d0d0">
      <polygon points="138,83 180,172 134,172"/>
      <rect x="144" y="171" width="4" height="11"/>
      <polygon points="104,181 194,181 178,199 120,199"/>
    </g>
    <g fill="#26767b">
      <path d="M0 369 L0 350 L150 272 L410 238 L460 152 L460 130 L600 124 L600 369 Z"/>
      <rect x="460" y="98" width="80" height="70"/>
      <rect x="454" y="94" width="92" height="7" rx="1"/>
      <rect x="463" y="66" width="74" height="30"/>
      <polygon points="450,68 550,68 526,50 474,50"/>
      <rect x="497" y="0" width="6" height="54"/>
    </g>
    <g fill="#e6f6f3">
      <rect x="473" y="73" width="11" height="17" rx="1"/>
      <rect x="494.5" y="73" width="11" height="17" rx="1"/>
      <rect x="516" y="73" width="11" height="17" rx="1"/>
    </g>
  </svg>
  <script src="fit.js"></script>
</body>
</html>
